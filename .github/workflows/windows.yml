name: Windows

on:
  workflow_dispatch:

  #push:
  #  branches: [ master ]

#
# Produces the same folder layout the release build has always had: x64 binaries
# at the top level, drivers for both architectures in AMD64\ and ARM64\, and the
# 32-bit helper in x86\ because a 64-bit process cannot inspect a 32-bit one
# without it.
#
# Only one application architecture is built. Windows on ARM runs x64 through
# emulation, so an ARM64 build of the GUI would add little; the drivers are the
# exception, since a kernel driver cannot be emulated and must match the host.
#
# Assembly is left to Installer\copy_build.cmd, which is the script the release
# build already uses - it also brings in the VC runtime, OpenSSL, 7-Zip, the
# translations archive and the resources. It is driven here with TE_CI=1, which
# skips its interactive pause and the EV code signing. That means the driver in
# these artifacts is NOT signed and will not load; sign the folder on a machine
# that has the certificate.
#
jobs:
  build:
    runs-on: windows-2022

    env:
      #
      # Must match the <QtInstall> in the .vcxproj files (6.8.3_msvc2022_64) and
      # the default copy_build.cmd uses, otherwise the app links against one Qt
      # and ships another.
      #
      QT_VERSION: 6.8.3

      #
      # Qt VS Tools version whose MSBuild targets are used; see the step below.
      # Taken from Qt's own download server, not the Visual Studio Marketplace -
      # the marketplace asset API needs an exact published version and returns
      # ExtensionAssetNotFoundException for anything else, whereas
      # download.qt.io/official_releases/vsaddin keeps every release addressable.
      #
      QT_VSTOOLS_VERSION: 3.5.0

      TE_CI: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v2

      #
      # copy_build.cmd looks for Qt at <repo>\..\Qt\<version>\msvc2022_64, so it
      # is installed there rather than in the default tool cache. install-qt-action
      # creates <dir>\Qt\<version>\msvc2022_64, hence dir being the parent of the
      # workspace.
      #
      #
      # No `modules:` list: for Qt 6 the SVG module and the Linguist tools are
      # part of the base package, not add-ons, and naming a module that does not
      # exist in the repository makes the install fail outright.
      #
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ github.workspace }}\..
          cache: true

      #
      # The .vcxproj files are Qt VS Tools projects: they import qt.props and
      # qt.targets to run moc, rcc and uic. Those files come from the Qt VS Tools
      # Visual Studio extension, which is not present on a hosted runner - without
      # them msbuild prints "could not locate qt.targets" and then fails to
      # compile anything generated.
      #
      # The extension is a zip, so the targets can be taken out of it without
      # installing it. If a QtMsBuild folder is committed to the repo it is used
      # instead, which makes the build reproducible and removes the download -
      # worth doing once this is known to work.
      #
      - name: Provide Qt VS Tools MSBuild targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vendored = Join-Path $env:GITHUB_WORKSPACE 'QtMsBuild'
          if (Test-Path (Join-Path $vendored 'qt.targets')) {
            Write-Host "Using the QtMsBuild committed to the repository"
          }
          else {
            $ver  = $env:QT_VSTOOLS_VERSION
            $url  = "https://download.qt.io/official_releases/vsaddin/$ver/qt-vsaddin-msvc2022-x64-$ver.vsix"
            $zip  = Join-Path $env:RUNNER_TEMP 'qt-vsaddin.zip'
            $out  = Join-Path $env:RUNNER_TEMP 'qt-vsaddin'

            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

            # A .vsix is an ordinary zip, so the targets can be taken out of it
            # without installing the extension. Expand-Archive insists on the
            # .zip extension, hence the name above.
            Expand-Archive -Path $zip -DestinationPath $out -Force

            $src = Join-Path $out 'QtMSBuild'
            if (-not (Test-Path (Join-Path $src 'qt.targets'))) {
              throw "qt.targets not found in $src - the extension layout changed"
            }
            $vendored = $src
          }

          Write-Host "QtMsBuild = $vendored"
          "QtMsBuild=$vendored" | Out-File $env:GITHUB_ENV -Append

      #
      # Drivers first, because copy_build.cmd expects them staged before it runs.
      #
      # A kernel driver must match the architecture of the kernel it loads into,
      # so unlike the GUI both are built.
      #
      - name: Build KTaskExplorer x64
        run: msbuild /t:build ProcessHacker\KSystemInformer\KSystemInformer.sln /p:Configuration="Release" /p:Platform=x64

      - name: Build KTaskExplorer ARM64
        run: msbuild /t:build ProcessHacker\KSystemInformer\KSystemInformer.sln /p:Configuration="Release" /p:Platform=ARM64

      - name: Upload drivers
        uses: actions/upload-artifact@v4
        with:
          name: TaskExplorer_drivers
          path: |
            ProcessHacker/KSystemInformer/bin/Release64/*.sys
            ProcessHacker/KSystemInformer/bin/Release64/*.dll
            ProcessHacker/KSystemInformer/bin/Release64/*.pdb
            ProcessHacker/KSystemInformer/bin/ReleaseARM64/*.sys
            ProcessHacker/KSystemInformer/bin/ReleaseARM64/*.dll
            ProcessHacker/KSystemInformer/bin/ReleaseARM64/*.pdb

      #
      # The System Informer libraries TaskExplorer links against. They are not
      # part of TaskExplorer+Libs.sln, so nothing in that solution builds them
      # and the link fails on the missing phlib.lib / kphlib_um.lib /
      # thirdparty.lib unless they are produced here first.
      #
      # Order matters: thirdparty.lib and kphlib_um.lib are inputs to phlib
      # (see the AdditionalDependencies in phlib.vcxproj), and SystemInformer.sln
      # already declares phlib -> kphlib, so only thirdparty has to be built as a
      # separate step.
      #
      # Both architectures the application is built for are needed - x64 for
      # TaskExplorer.exe and Win32 for the x86 TaskHelper.exe. ARM64 is not,
      # since no ARM64 application is built.
      #
      # thirdparty.sln names its 32-bit solution platform "x86" while
      # SystemInformer.sln names it "Win32"; both map to the Win32 project
      # platform, hence the different /p:Platform values below.
      #
      - name: Build thirdparty x64
        run: msbuild /t:build ProcessHacker\tools\thirdparty\thirdparty.sln /p:Configuration="Release" /p:Platform=x64

      - name: Build thirdparty x86
        run: msbuild /t:build ProcessHacker\tools\thirdparty\thirdparty.sln /p:Configuration="Release" /p:Platform=x86

      - name: Build SystemInformer libs x64
        run: msbuild /t:build ProcessHacker\SystemInformer.sln /p:Configuration="Release" /p:Platform=x64

      - name: Build SystemInformer libs Win32
        run: msbuild /t:build ProcessHacker\SystemInformer.sln /p:Configuration="Release" /p:Platform=Win32

      #
      # The application and its helper libraries.
      #
      # QtInstall is overridden with the Qt *directory* rather than the version
      # name the projects carry (6.8.3_msvc2022_64). That name is a Qt registered
      # with the Visual Studio extension, looked up under
      # HKCU\Software\QtProject\QtVsTools\Versions, and nothing is registered on
      # a hosted runner. qt_private.props accepts either form:
      #
      #     <QtInstallDir Condition="Exists('$(QtInstall)')">$(QtInstall)</QtInstallDir>
      #
      # so an existing path is taken as the installation directly, which avoids
      # having to write registry keys. A /p: property is global and overrides the
      # per-configuration value in the project file.
      #
      - name: Build TaskExplorer x64
        run: >
          msbuild /t:build TaskExplorer+Libs.sln
          /p:Configuration="Release" /p:Platform=x64
          /p:QtMsBuild="${{ env.QtMsBuild }}"
          /p:QtInstall="${{ github.workspace }}\..\Qt\${{ env.QT_VERSION }}\msvc2022_64"

      #
      # 32-bit build, for the x86\TaskHelper.exe that lets the 64-bit GUI read
      # 32-bit processes.
      #
      # Built from TaskHelper.sln rather than TaskExplorer+Libs.sln: the latter
      # would drag in every Qt library and TaskExplorer.exe itself for Win32,
      # none of which is shipped for 32-bit and none of which builds here - only
      # a 64-bit Qt is installed. TaskHelper.vcxproj itself uses no Qt, so this
      # step needs none of the Qt properties above; it links only phlib
      # (Release32), which the SystemInformer step already produced.
      #
      # TaskHelper.sln sits at the repository root so $(SolutionDir) is
      # unchanged, and the binary still lands in Win32\Release where
      # copy_build.cmd looks for it.
      #
      - name: Build TaskHelper32
        run: msbuild /t:build TaskHelper.sln /p:Configuration="Release" /p:Platform=Win32

      - name: Fetch OpenSSL
        working-directory: Installer
        run: .\get_openssl.cmd

      - name: Fetch 7-Zip
        working-directory: Installer
        run: .\get_7zip.cmd

      #
      # copy_build.cmd folds Qt's own translations into translations.7z, reading
      # them from Installer\qttranslations\qm - a folder the release process fills
      # in by hand and which is not in the repository. Without it the archive
      # holds only TaskExplorer's own .qm files and Qt's stock dialog strings stay
      # English, so they are taken from the Qt that was just installed.
      #
      - name: Stage Qt translations
        shell: pwsh
        run: |
          $qt = "${{ github.workspace }}\..\Qt\${{ env.QT_VERSION }}\msvc2022_64\translations"
          New-Item -ItemType Directory -Force -Path Installer\qttranslations\qm | Out-Null
          if (Test-Path $qt) {
            Copy-Item "$qt\*.qm" Installer\qttranslations\qm\ -Force
            Write-Host "staged $((Get-ChildItem Installer\qttranslations\qm).Count) .qm files"
          } else {
            Write-Warning "no translations directory at $qt"
          }

      #
      # copy_build.cmd reads the drivers from Installer\Drivers\TaskExplorer_<arch>,
      # which is where the release process puts them by hand.
      #
      - name: Stage drivers for assembly
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Installer\Drivers\TaskExplorer_x64, Installer\Drivers\TaskExplorer_ARM64 | Out-Null
          Copy-Item ProcessHacker\KSystemInformer\bin\Release64\*      Installer\Drivers\TaskExplorer_x64\    -Force -ErrorAction Continue
          Copy-Item ProcessHacker\KSystemInformer\bin\ReleaseARM64\*   Installer\Drivers\TaskExplorer_ARM64\  -Force -ErrorAction Continue

      #
      # Assembles Installer\Build into the layout that ships. Arguments are
      # arch, Qt5 version, Qt6 version - the Qt5 one is unused by this build but
      # the script takes it positionally.
      #
      - name: Assemble the build folder
        working-directory: Installer
        run: .\copy_build.cmd x64 5.15.16 ${{ env.QT_VERSION }}

      - name: Show what was assembled
        shell: pwsh
        run: |
          if (-not (Test-Path Installer\Build\TaskExplorer.exe)) {
            Write-Error "TaskExplorer.exe missing - assembly did not produce a usable folder"
          }
          Get-ChildItem Installer\Build | Select-Object Mode, Length, Name | Format-Table -AutoSize
          foreach ($d in 'AMD64','ARM64','x86','platforms','styles','tls') {
            Write-Host "--- $d"
            Get-ChildItem "Installer\Build\$d" -ErrorAction Continue | Select-Object -ExpandProperty Name
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TaskExplorer_win_x64
          path: Installer/Build/**
